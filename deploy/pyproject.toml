# Lint settings for the stdlib only container scripts in deploy/scripts/. They are not a package,
# this file exists so Ruff finds a config here instead of falling back to its 88 column default.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
