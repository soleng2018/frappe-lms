# Spec 0012 AC-9: add the Nile stylesheet to every HTML page the backend sends, the LMS app page
# included. That page is a standalone template, so no Frappe hook can add a stylesheet to it.
# Included at server level by the image build (see the Containerfile), so it applies to the proxy.
sub_filter '</head>' '<link rel="stylesheet" href="/assets/nile_auth/css/nile-brand.css"></head>';
sub_filter_once on;
