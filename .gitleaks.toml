# Default rules, plus paths a tree scan must skip: the real config file (spec 0002 scans it
# itself) and folders that are not ours.
[extend]
useDefault = true

[[allowlists]]
description = "Paths a tree scan must skip"
paths = [
  '''(^|/)\.env$''',
  '''(^|/)deploy/\.upstream/''',
  '''(^|/)\.venv/''',
  '''__pycache__/''',
  '''\.ruff_cache/''',
  '''\.mypy_cache/''',
  '''\.pytest_cache/''',
]

# A `key:` line in a course file is a record identity (a slug), not a secret, but the generic API
# key rule reads long slugs as one. Only that rule, only course files.
[[allowlists]]
description = "Course keys in content/<course>/course.yaml"
targetRules = ["generic-api-key"]
paths = ['''(^|/)content/[^/]+/course\.yaml$''']
