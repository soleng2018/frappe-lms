[project]
name = "nile-tools"
version = "0.1.0"
description = "Setup, Authentik and content sync scripts for the Nile LMS"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx>=0.27", "PyYAML>=6"]

[dependency-groups]
dev = ["mypy>=1.11", "pre-commit>=3.8", "pytest>=8", "pytest-cov>=5", "ruff>=0.6", "types-PyYAML>=6"]

[project.scripts]
tools = "nile_tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nile_tools"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = ["integration: needs the running Docker stack (run with: pytest -m integration)"]

[tool.coverage.run]
source = ["nile_tools"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "S", "RUF", "ANN", "D100", "D101", "D102", "D103"]
ignore = ["ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests assert, skip hints and docstrings, use fake secrets, and run fixed git/make/docker argument lists.
"tests/**" = ["S101", "S105", "S603", "S607", "S608", "ANN", "D"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
