[project]
name = "nile-tools"
version = "0.1.0"
description = "Setup, Authentik and content sync scripts for the Nile LMS"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "PyYAML>=6"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
tools = "nile_tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nile_tools"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = ["integration: needs the running Docker stack (run with: pytest -m integration)"]
