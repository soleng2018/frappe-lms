# The Nile Workshop course. One file, plus one markdown file per lab guide in content/labs/.
# Every key is the record's identity in the LMS: change a title freely, never change a key.
key: nile-workshop
title: Nile Workshop
short_introduction: Learn the basics, then prove them in the hands on lab.
description: A short video, a quiz on it, a lab guide, and a quiz on the lab. Pass both quizzes to earn the certificate.
chapters:
  - key: ch-concepts
    title: Concepts
    lessons:
      - {key: l-intro-video, type: video, title: Introduction video, youtube: dQw4w9WgXcQ}
      - {key: l-intro-quiz, type: quiz, title: Introduction quiz, quiz: q-intro}
  - key: ch-lab
    title: Hands on lab
    lessons:
      - {key: l-lab-guide, type: lab, title: Lab guide, body_file: labs/lab-guide.md}
      - {key: l-lab-quiz, type: quiz, title: Lab quiz, quiz: q-lab}
quizzes:
  - key: q-intro
    title: Introduction quiz
    passing_percentage: 80
    max_attempts: 3
    questions:
      - key: q-intro-1
        text: What is the video about?
        options:
          - {text: The Nile Workshop, correct: true}
          - {text: Something else}
  - key: q-lab
    title: Lab quiz
    questions:
      - key: q-lab-1
        text: Did you finish the lab?
        options:
          - {text: "Yes", correct: true}
          - {text: "No"}
